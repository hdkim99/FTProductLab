[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "ftproductlab"
version = "0.1.1"
description = "Reproducible Fischer-Tropsch product-distribution and ASF analysis"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Peter Kim"}]
keywords = ["anderson-schulz-flory", "catalysis", "fischer-tropsch", "product-distribution"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.8,<4"]
gui = ["matplotlib>=3.8,<4"]
dev = [
  "build==1.5.0",
  "matplotlib>=3.8,<4",
  "mypy>=1.15,<3",
  "pip-audit>=2.9,<3",
  "pytest>=8.3,<10",
  "ruff>=0.11,<0.18",
  "twine>=6.1,<7",
]

[project.scripts]
ftproductlab = "ftproductlab.cli.main:main"
ftproductlab-gui = "ftproductlab.gui.app:main"

[project.urls]
Homepage = "https://github.com/hdkim99/FTProductLab"
Documentation = "https://github.com/hdkim99/FTProductLab#readme"
Issues = "https://github.com/hdkim99/FTProductLab/issues"
Repository = "https://github.com/hdkim99/FTProductLab"

[tool.hatch.build.targets.wheel]
packages = ["src/ftproductlab"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/assets",
  "/scripts",
  "/.github",
  "/LICENSE",
  "/README.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/CITATION.cff",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "scripts"]
warn_unreachable = true
follow_imports = "skip"
no_site_packages = true

[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*", "numpy", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
markers = [
  "gui: window lifecycle and GUI workflow tests",
  "macos: tests requiring a real macOS window server",
]
